# Publishes a GitHub release when a version tag is pushed (git tag v0.4.1 && git push origin v0.4.1).
#
# The Windows installer is built locally with `npm run dist:win` and committed to
# release-latest/, so this workflow does not build anything: it checks that the tag
# matches package.json, then attaches that installer to the release.
# Release notes come from release-notes/<tag>.md if it exists, otherwise GitHub's
# auto-generated notes are used.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, version and installer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          installer="release-latest/GureevDoc Setup $version.exe"
          if [ ! -f "$installer" ]; then
            echo "Installer not found: $installer" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f "release-notes/$TAG.md" ]; then
            notes=(--notes-file "release-notes/$TAG.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" "$INSTALLER" --title "GureevDoc $VERSION" "${notes[@]}"
