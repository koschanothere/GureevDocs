# Publishes a GitHub release, either when a version tag is pushed
# (git tag v0.4.1 && git push origin v0.4.1) or when the workflow is started by hand
# from the Actions tab with a tag name (the tag is then created on main).
#
# The Windows installer is built locally with `npm run dist:win` and committed to
# release-latest/, so this workflow does not build anything: it checks that the tag
# matches package.json, then attaches that installer to the release.
# Release notes come from release-notes/<tag>.md if it exists, otherwise GitHub's
# auto-generated notes are used.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.4.1 (created on main if it does not exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # A manual run is only allowed from main, so the tag can't land on a stray branch.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, version and installer
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          installer="release-latest/GureevDoc Setup $version.exe"
          if [ ! -f "$installer" ]; then
            echo "Installer not found: $installer" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -f "release-notes/$TAG.md" ]; then
            notes=(--notes-file "release-notes/$TAG.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" "$INSTALLER" --target "$GITHUB_SHA" --title "GureevDoc $VERSION" "${notes[@]}"
